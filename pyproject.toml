[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitwise"
dynamic = ["version"]
description = "Curve fitting made easy: one call, one fit, one report you can trust."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Matthias Baer", email = "matthias.r.baer@googlemail.com" }]
keywords = ["curve fitting", "least squares", "regression", "lmfit", "uncertainty", "data analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "lmfit>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
odr = ["odrpack>=0.6"]
units = ["pint>=0.23", "uncertainties>=3.2"]
symbolic = ["sympy>=1.12"]
batch = ["pandas>=2.1"]
all = ["fitwise[plot,odr,units,symbolic,batch]"]

[project.urls]
Homepage = "https://github.com/maroba/fitwise"
Documentation = "https://maroba.github.io/fitwise/"
Repository = "https://github.com/maroba/fitwise"
Issues = "https://github.com/maroba/fitwise/issues"
Changelog = "https://github.com/maroba/fitwise/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
lint = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pre-commit>=4.0",
    "scipy-stubs>=1.17.1.5",
]
docs = [
    "sphinx>=8.0",
    "pydata-sphinx-theme>=0.16",
    "myst-parser>=4.0",
    "sphinx-gallery>=0.19",
    "sphinx-copybutton>=0.5",
    "matplotlib>=3.8",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
path = "src/fitwise/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fitwise"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/LICENSE", "/README.md", "/CHANGELOG.md"]

# --- Ruff ---------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Code blocks in Markdown are aligned by hand for readability.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "NPY",      # numpy
    "PT",       # pytest style
    "D",        # docstrings
]
ignore = [
    "D105",     # magic methods need no docstring
    "D107",     # __init__ is documented on the class
    "RUF001",   # ambiguous unicode (σ, χ², ± are intended)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tests/free_models.py" = ["D", "N803"]  # physics symbols such as A, Ea, K
"conftest.py" = ["D"]
# sphinx-gallery: titled docstrings, imports per cell, physics symbols such as T or Ea
"examples/**" = ["D", "E402", "N803", "N806", "N816"]
"docs/**" = ["D"]

# --- mypy ---------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/fitwise"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["lmfit.*", "odrpack.*", "pint.*", "uncertainties.*", "sympy.*"]
ignore_missing_imports = true

# --- pytest -------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--strict-markers --strict-config -ra --doctest-modules"
xfail_strict = true
filterwarnings = [
    "error",
    # deprecations in third-party packages must not break the suite, ours must
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
    "error::DeprecationWarning:fitwise",
]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "nist: NIST StRD nonlinear regression reference tests",
]

[tool.coverage.run]
source = ["fitwise"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
